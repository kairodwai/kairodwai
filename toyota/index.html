    const MILES = [['u5', 'น้อยกว่า 5,000'], ['5-10', '5,000 – 10,000']];
    for (let k = 10000; k < 150000; k += 10000) MILES.push([String(k), fmt(k) + ' – ' + fmt(k + 10000)]);
    MILES.push(['150up', 'มากกว่า 150,000']);
    const years = [];
    for (let y = 2026; y >= 2016; y--) years.push(String(y));
    const DOT = 'width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: \'Kanit\', sans-serif; font-weight: 600; font-size: 16px; line-height: 1; ';
    const DONE = 'background: #06C755; color: #FFFFFF;', ACTIVE = 'background: #141414; color: #FFFFFF;', TODO = 'background: #E9E6DF; color: #55534E;';
    const LN_ON = 'background: #06C755;', LN_OFF = 'background: #DEDBD3;';
    const trk = (n) => { try { window.KR.track(n); } catch (e) {} };
    const quit = () => { this._hold = null; this.setState({ holding: false, ready: false, missing: false }); trk('NotReady'); try { localStorage.setItem('kr_noready', String(Date.now())); } catch (e) {} };
    const holdStart = (e) => { if (e && e.preventDefault) e.preventDefault(); if (this._hold) return; this._hold = setTimeout(quit, 700); this.setState({ holding: true }); };
    const holdEnd = () => { if (!this._hold) return; clearTimeout(this._hold); this._hold = null; this.setState({ holding: false }); };
    return {
      holdStart, holdEnd,
      holdKey: (e) => { if (e.key !== ' ' && e.key !== 'Enter') return; e.preventDefault(); if (e.type === 'keydown') { if (!e.repeat) holdStart(); } else holdEnd(); },
      noMenu: (e) => e.preventDefault(),
      holdBar: st.holding ? 'width: 100%; transition: width 0.7s linear;' : 'width: 0; transition: none;',
      gateOn: !st.sent && st.ready === null,
      notReady: !st.sent && st.ready === false,
      readyYes: () => { this.setState({ ready: true, missing: false }); trk('ReadyToSell'); },
      readyNo: quit,
      dot1: DOT + (st.step > 1 ? DONE : ACTIVE), dot1Txt: st.step > 1 ? '\u2713' : '1',
      dot2: DOT + (st.step > 2 ? DONE : st.step === 2 ? ACTIVE : TODO), dot2Txt: st.step > 2 ? '\u2713' : '2',
      dot3: DOT + (st.step === 3 ? ACTIVE : TODO),
      ln1: st.step > 1 ? LN_ON : LN_OFF, ln2: st.step > 2 ? LN_ON : LN_OFF,
      refNo: st.refNo || '',
      photoHref: st.photoHref || '',
      brands: brandList.concat(['ยี่ห้ออื่น']),
      noYear: noYear,
      brandHint: noYear ? 'เลือกปีก่อน' : 'เลือกยี่ห้อ',
      brandStyle: sel + (noYear ? ' background: #F5F4F0; color: #55534E;' : ''),
      brandVal: st.brand || '',
      modelVal: st.model || '',
      trimVal: st.trim || '',
      pickBrand: (e) => this.setState({ brand: e.target.value || null, model: null, trim: null, missing: false }),
      showTrim: trimList.length > 0,
      trims: trimList.concat(['ไม่แน่ใจรุ่นย่อย']),
      pickTrim: (e) => this.setState({ trim: e.target.value || null }),
      noBrand: !entry,
      models: modelNames,
      modelHint: entry ? 'เลือกรุ่น' : (otherBrand ? 'พิมพ์ด้านล่าง' : 'เลือกยี่ห้อก่อน'),
      modelStyle: sel + (entry ? '' : ' background: #F5F4F0; color: #55534E;'),
      pickModel: (e) => this.setState({ model: e.target.value || null, trim: null }),
      askText: otherBrand || st.model === 'รุ่นอื่น',
      textLabel: otherBrand ? 'ยี่ห้อและรุ่น' : 'รุ่นของคุณ',
      textHint: otherBrand ? 'เช่น Hyundai Creta' : 'พิมพ์ชื่อรุ่น',
      years: years,
      pickYear: (e) => {
        const v = e.target.value; const y = /^\d{4}$/.test(v) ? Number(v) : null;
        const ok = (r) => !y || r.some((_, i) => i % 2 === 0 && y >= r[i] && y <= r[i + 1]);
        let brand = st.brand, model = st.model, trim = st.trim;
        if (!v) { brand = null; model = null; trim = null; }
        if (brand && CARS[brand] && !Object.values(CARS[brand]).some((m) => Object.values(m).some(ok))) { brand = null; model = null; trim = null; }
        if (brand && model && CARS[brand] && CARS[brand][model] && !Object.values(CARS[brand][model]).some(ok)) { model = null; trim = null; }
        if (brand && model && trim && CARS[brand] && CARS[brand][model] && CARS[brand][model][trim] && !ok(CARS[brand][model][trim])) trim = null;
        this.setState({ year: v, brand, model, trim, missing: false });
      },
      yearOld: yearOld,
      miles: MILES.map((m) => ({ id: m[0], name: m[1] })),
      pickMile: (e) => this.setState({ mile: e.target.value || null, missing: false }),
      mileHigh: mileHigh,
      financed: st.financed,
      notFinanced: !st.financed,
      noStyle: (st.financed ? off : on) + ' width: 100%;',
      yesStyle: (st.financed ? on : off) + ' width: 100%;',
      pickNo: () => this.setState({ financed: false }),
      pickYes: () => this.setState({ financed: true }),
      blocked: blocked,
      sendLabel: blocked ? 'รถคันนี้ยังไม่อยู่ในเกณฑ์รับซื้อ' : (st.step < 3 ? 'ต่อไป' : (st.sending ? 'กำลังส่ง…' : 'ขอราคา')),
      sendStyle: 'height: 56px; border: 0; border-radius: 28px; font-family: \'Kanit\', sans-serif; font-size: 18px; font-weight: 500; ' + (blocked ? 'background: #E4E1DA; color: #4A4843; cursor: not-allowed;' : 'background: #141414; color: #FFFFFF; cursor: pointer;'),
      sent: st.sent,
      stepNo: st.step,
      step1: st.step === 1,
      step2: st.step === 2,
      step3: st.step === 3,
      stepTitle: ['เลือกรถของคุณ', 'ยังผ่อนอยู่ไหม', 'ทิ้งเบอร์ไว้ ทีมส่งราคาให้'][st.step - 1],
      seg2: st.step >= 2 ? 'background: #141414;' : 'background: #DEDBD3;',
      seg3: st.step >= 3 ? 'background: #141414;' : 'background: #DEDBD3;',
      canBack: st.step > 1,
      sellOpts: [['now', 'ตอนนี้'], ['7d', 'ภายใน 7 วัน'], ['month', 'ภายในเดือนนี้']].map((o) => ({ label: o[1], on: st.sell === o[0], pick: () => this.setState({ sell: o[0], missing: false }), style: (st.sell === o[0] ? on : off) + ' width: 100%;' })),
      photoDrag: (e) => {
        if (e.pointerType !== 'mouse' || e.button !== 0) return;
        const el = e.currentTarget; const x0 = e.clientX, s0 = el.scrollLeft;
        el.style.scrollSnapType = 'none'; el.style.cursor = 'grabbing';
        const move = (ev) => { el.scrollLeft = s0 - (ev.clientX - x0); };
        const up = () => {
          window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
          const it = [...el.querySelectorAll('.photo-item')]; const pad = it.length ? it[0].offsetLeft : 0;
          let best = 0, d = Infinity; it.forEach((n) => { const t = n.offsetLeft - pad; if (Math.abs(t - el.scrollLeft) < d) { d = Math.abs(t - el.scrollLeft); best = t; } });
          el.style.cursor = ''; el.scrollTo({ left: best, behavior: 'smooth' });
          setTimeout(() => { el.style.scrollSnapType = ''; }, 400);
        };
        window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
      },
      photoScroll: (e) => { const el = e.currentTarget || e.target; const it = el.querySelector('.photo-item'); if (!it) return; const i = Math.round(el.scrollLeft / (it.offsetWidth + 12)); if (i !== st.photoIdx) this.setState({ photoIdx: Math.max(0, Math.min(2, i)) }); },
      photoPrev: () => this.goPhoto(Math.max(0, st.photoIdx - 1)),
      photoNext: () => this.goPhoto(Math.min(2, st.photoIdx + 1)),
      photoDots: [0, 1, 2].map((i) => ({ go: () => this.goPhoto(i), label: 'รูปที่ ' + (i + 1), style: 'display: block; height: 8px; border-radius: 4px; transition: width .2s; ' + (i === st.photoIdx ? 'width: 22px; background: #141414;' : 'width: 8px; background: #C9C5BC;') })),
      lineReady: false,
      lineLocked: true,
      goForm: () => { if (!blocked) this.setState({ missing: true }); const f = document.querySelector('form'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
      lineHref: 'https://line.me/R/oaMessage/%40kairodwai/?' + encodeURIComponent('สนใจขายรถ: ' + [st.brand === 'ยี่ห้ออื่น' ? (st.other || 'ยี่ห้ออื่น') : st.brand, st.model === 'รุ่นอื่น' ? st.other : st.model, st.trim && st.trim !== 'ไม่แน่ใจรุ่นย่อย' ? st.trim : ''].filter(Boolean).join(' ') + (st.year ? ' ปี ' + st.year : '') + (st.mile ? ' ไมล์ ' + ((MILES.find((m) => m[0] === st.mile) || [0, ''])[1]) + ' กม.' : '') + (st.financed ? ' (ยังผ่อนอยู่)' : '') + (st.sell === '7d' ? ' · จะขายภายใน 7 วัน' : st.sell === 'month' ? ' · จะขายภายในเดือนนี้' : st.sell === 'price' ? ' · อยากรู้ราคาก่อน' : '')),
      formOn: !st.sent && !blocked && st.ready === true,
      rejected: !st.sent && blocked,
      formSkin: (!st.sent && blocked) ? 'background: #FCEEE7; border: 1px solid #E8B4A0;' : 'background: #FFFFFF; border: 1px solid #DEDBD3;',
      rejectReason: yearOld && mileHigh ? 'เรารับรถปี 2016 ขึ้นไป และไมล์ไม่เกิน 150,000 กม. เท่านั้น' : (yearOld ? 'เรารับรถปี 2016 ขึ้นไปเท่านั้น' : 'เรารับรถไมล์ไม่เกิน 150,000 กม. เท่านั้น'),
      startOver: () => this.setState({ sell: '', step: 1, missing: false, financed: false, sent: false, brand: null, model: null, trim: null, year: '', mile: null, other: '', price: '', term: '', paid: '', monthly: '', phone: '' }),
      fixBlocked: () => this.setState({ year: yearOld ? '' : st.year, mile: mileHigh ? null : st.mile, missing: false }),
      prev: () => this.setState({ step: st.step - 1, missing: false }),
      next: () => {
        if (blocked) return;
        const ok = st.step === 1 ? (st.brand && st.year && st.mile) : st.step === 3 ? st.phone.replace(/\D/g, '').length >= 9 : !!st.sell;
        if (!ok) { this.setState({ missing: true }); return; }
        if (st.step < 3) this.setState({ step: st.step + 1, missing: false }); else if (!st.sending) { this.setState({ sending: true, missing: false, failed: false }); window.KR.lead(st, MILES).then((r) => { if (r && r.ok) this.setState({ sending: false, sent: true, refNo: r.ref || '', photoHref: r.t ? '/line/?t=' + r.t + '&ref=' + encodeURIComponent(r.ref || '') : '' }); else this.setState({ sending: false, sent: false, failed: true, missing: true }); }); }
      },
      showMissing: st.missing,
      missingText: st.failed ? 'ส่งไม่สำเร็จ สัญญาณอาจหลุด กดขอราคาอีกครั้งได้เลย' : st.step === 1 ? 'กรุณาเลือกข้อมูลรถของคุณก่อน' : st.step === 2 ? 'กรุณาเลือกว่าจะขายเมื่อไหร่' : 'ใส่เบอร์โทรให้ครบก่อนนะครับ',
      summary: [st.brand === 'ยี่ห้ออื่น' ? (st.other || 'ยี่ห้ออื่น') : st.brand, st.model === 'รุ่นอื่น' ? st.other : st.model, st.trim && st.trim !== 'ไม่แน่ใจรุ่นย่อย' ? st.trim : '', st.year].filter(Boolean).join(' · '),
      yearVal: st.year,
      mileVal: st.mile || '',
      otherVal: st.other,
      setOther: (e) => this.setState({ other: e.target.value }),
      priceVal: st.price, setPrice: (e) => this.setState({ price: e.target.value }),
      termVal: st.term, setTerm: (e) => this.setState({ term: e.target.value }),
      paidVal: st.paid, setPaid: (e) => this.setState({ paid: e.target.value }),
      monthlyVal: st.monthly, setMonthly: (e) => this.setState({ monthly: e.target.value }),
      phoneVal: st.phone, setPhone: (e) => this.setState({ phone: e.target.value, missing: false }),
      notSent: !st.sent,
      send: () => {},
      back: () => this.setState({ sent: false, step: 1 })
    };
  }
}
</script>
