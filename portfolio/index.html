  { brand: 'Toyota', title: 'Toyota [รุ่น รุ่นย่อย] · [ปี]', prov: 'เชียงใหม่', month: '[เดือน ปี]', fin: true },
  { brand: 'Honda', title: 'Honda [รุ่น รุ่นย่อย] · [ปี]', prov: 'กรุงเทพฯ', month: '[เดือน ปี]', fin: false },
  { brand: 'Mazda', title: 'Mazda [รุ่น รุ่นย่อย] · [ปี]', prov: 'ชลบุรี', month: '[เดือน ปี]', fin: false },
  { brand: 'BYD', title: 'BYD [รุ่น รุ่นย่อย] · [ปี]', prov: 'ขอนแก่น', month: '[เดือน ปี]', fin: true },
  { brand: 'Toyota', title: 'Toyota [รุ่น รุ่นย่อย] · [ปี]', prov: 'กรุงเทพฯ', month: '[เดือน ปี]', fin: false },
  { brand: 'Mercedes-Benz', title: 'Mercedes-Benz [รุ่น รุ่นย่อย] · [ปี]', prov: 'นนทบุรี', month: '[เดือน ปี]', fin: true }
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { brand: '', prov: '' }; }
  renderVals() {
    const st = this.state;
    const uniq = (a) => a.filter((x, i) => a.indexOf(x) === i).sort((x, y) => x.localeCompare(y, 'th'));
    const list = ITEMS.filter((c) => (!st.brand || c.brand === st.brand) && (!st.prov || c.prov === st.prov));
    return {
      brands: uniq(ITEMS.map((c) => c.brand)), provs: uniq(ITEMS.map((c) => c.prov)),
      brandVal: st.brand, provVal: st.prov,
      pickBrand: (e) => this.setState({ brand: e.target.value }),
      pickProv: (e) => this.setState({ prov: e.target.value }),
      items: list.map((c) => ({ title: c.title, meta: c.prov + ' · ' + c.month, fin: c.fin })),
      empty: list.length === 0,
      countText: 'แสดง ' + list.length + ' คัน'
    };
  }
}
</script>
