</style>

<script>
// ลิงก์โฆษณา: kairodwai.com/go?utm_… → เปิดเว็บเราในแอปไลน์ (LIFF "kairodwai-web") รู้ตัวตนลูกค้าตั้งแต่แรก
// Android: ลองเปิดแอปด้วย intent:// (ไม่ใส่ fallback เพื่อไม่ให้ Chrome พาไปเว็บเอง) — ถ้า Chrome ไม่ยอม (ไม่ใช่การกดของคน) ภายใน 1.2 วิ จะขึ้นปุ่มให้กดเอง
// iOS: โชว์ปุ่มเลย (Safari เปิดแอปจากการกดเท่านั้น)   คอม/ไม่มี ID: เว็บธรรมดา   utm/fbclid ส่งต่อครบทุกทาง
(function () {
  var ID = '2012318037-06TwYIml';
  var q = new URLSearchParams(location.search); q.delete('via');
  var webUrl = '/' + (q.toString() ? '?' + q.toString() : '');
  q.set('via', 'liff');
  var liffUrl = 'https://liff.line.me/' + ID + '?' + q.toString();
  var intentUrl = 'intent://liff.line.me/' + ID + '?' + q.toString() + '#Intent;scheme=https;package=jp.naver.line.android;end';
  var ua = navigator.userAgent, android = /Android/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);
  if (!ID || !(android || ios)) { location.replace(webUrl); return; }
  var openLine = document.getElementById('openLine');
  openLine.href = android ? intentUrl : liffUrl;
  var showManual = function () { document.getElementById('wait').hidden = true; document.getElementById('manual').hidden = false; };
  if (ios) { showManual(); return; }
  setTimeout(function () { if (!document.hidden) showManual(); }, 1200);
  try { location.href = intentUrl; } catch (e) { showManual(); }
})();
