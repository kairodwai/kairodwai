<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ขายรถไว</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap">
<style>
html,body{margin:0;min-height:100%;background:#F5F4F0;font-family:Kanit,system-ui,sans-serif;color:#16201a}
main{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;text-align:center}
.card{display:grid;gap:16px;justify-items:center;max-width:360px;width:100%}
img{width:120px;height:auto}
h1{font-size:22px;font-weight:600;margin:0;line-height:1.3}
p{margin:0;color:#5b6660;font-size:15px;line-height:1.5}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:12px;background:#06C755;color:#fff;font-weight:600;font-size:18px;text-decoration:none}
.cta svg{width:24px;height:24px;flex:none}
.alt{color:#5b6660;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:12px}
#wait{display:grid;gap:8px}[hidden]{display:none!important}
</style>
</head><body><main><div class="card">
<img src="/img/logo.png" alt="ขายรถไว">
<div id="wait"><h1>กำลังเปิดในแอป LINE…</h1><p>กรอกข้อมูลรถ ส่งรูป คุยกับทีมงานได้ในไลน์เลย</p></div>
<div id="manual" hidden class="card">
  <h1>เปิดในแอป LINE เพื่อเริ่ม</h1>
  <p>กรอกข้อมูลรถ ส่งรูป และคุยกับทีมงานได้ในไลน์เลย ใช้เวลาไม่ถึง 1 นาที</p>
  <a class="cta" id="openLine" href="#"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg><span>เปิดในแอป LINE</span></a>
  <a class="alt" id="openWeb" href="/">เปิดในเว็บแทน</a>
</div>
</div></main>
<script>
// ลิงก์โฆษณา: kairodwai.com/go?utm_… → เปิดเว็บเราในแอปไลน์ (LIFF "kairodwai-web") รู้ตัวตนลูกค้าตั้งแต่แรก
// มือถือ: ลองเปิดแอปอัตโนมัติ 1 ครั้ง (Android ใช้ intent:// เพื่อเลี่ยงหน้า login ของ LINE บน browser) ถ้าไม่เด้งใน 1.2 วิ โชว์ปุ่มให้กดเอง (การกดของคนเปิดแอปได้ชัวร์กว่า)
// คอม / ไม่มีแอป: เว็บธรรมดา   พารามิเตอร์ utm/fbclid ส่งต่อครบทุกทาง
(function () {
  var ID = '__LIFF_WEB_ID__';
  var q = new URLSearchParams(location.search); q.delete('via');
  var webUrl = '/' + (q.toString() ? '?' + q.toString() : '');
  q.set('via', 'liff');
  var liffUrl = 'https://liff.line.me/' + ID + '?' + q.toString();
  var ua = navigator.userAgent, android = /Android/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);
  if (!ID || !(android || ios)) { location.replace(webUrl); return; }
  document.getElementById('openLine').href = liffUrl;
  document.getElementById('openWeb').href = webUrl;
  var t0 = Date.now();
  setTimeout(function () { if (!document.hidden && Date.now() - t0 < 4000) { document.getElementById('wait').hidden = true; document.getElementById('manual').hidden = false; } }, 1200);
  try {
    if (android) location.href = 'intent://liff.line.me/' + ID + '?' + q.toString() + '#Intent;scheme=https;package=jp.naver.line.android;S.browser_fallback_url=' + encodeURIComponent(location.origin + webUrl) + ';end';
    else location.href = liffUrl;
  } catch (e) {}
})();
</script></body></html>
